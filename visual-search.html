<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Product Search - Offer Alert Bot</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .visual-search-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .upload-area {
            border: 3px dashed #007bff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #0056b3;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }
        
        .upload-area.dragover {
            border-color: #28a745;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        }
        
        .search-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .result-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .result-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .result-info {
            padding: 15px;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .result-price {
            font-size: 24px;
            color: #007bff;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .result-original-price {
            text-decoration: line-through;
            color: #6c757d;
            margin-right: 10px;
        }
        
        .result-discount {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .search-loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #007bff;
        }
        
        .search-loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }
        
        .back-btn:hover {
            background: #5a6268;
        }
        
        .preview-image {
            max-width: 300px;
            max-height: 300px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .search-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .category-filter {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .no-results i {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="visual-search-container">
        <button class="back-btn" onclick="window.close()">← Back to Main App</button>
        
        <header style="text-align: center; margin-bottom: 30px;">
            <h1 style="color: #007bff; margin-bottom: 10px;">
                🔍 Visual Product Search
            </h1>
            <p style="color: #6c757d; font-size: 18px;">
                Upload an image or describe what you're looking for
            </p>
        </header>

        <div class="search-controls">
            <input type="text" 
                   class="search-input" 
                   id="searchInput" 
                   placeholder="Describe what you're looking for (e.g., 'red running shoes', 'wireless headphones')">
            
            <select class="category-filter" id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home & Kitchen</option>
                <option value="Beauty">Beauty</option>
                <option value="Sports">Sports</option>
            </select>
            
            <button class="btn btn-primary" onclick="performSearch()" style="padding: 12px 24px;">
                Search
            </button>
        </div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <div style="font-size: 48px; margin-bottom: 20px;">📸</div>
            <h3 style="margin-bottom: 15px;">Upload Product Image</h3>
            <p style="color: #6c757d; margin-bottom: 20px;">
                Drag & drop an image here or click to browse
            </p>
            <button class="btn btn-outline-primary" onclick="document.getElementById('fileInput').click()">
                Choose Image
            </button>
        </div>

        <div id="imagePreview" style="display: none; text-align: center;">
            <h3 style="margin-bottom: 15px;">Uploaded Image:</h3>
            <img id="previewImg" class="preview-image" alt="Preview">
            <div style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="searchByImage()">Search Similar Products</button>
                <button class="btn btn-secondary" onclick="clearImage()">Clear</button>
            </div>
        </div>

        <div id="searchResults" style="display: none;">
            <h2 style="margin-bottom: 20px;">Search Results</h2>
            <div class="search-results" id="resultsContainer"></div>
        </div>

        <div id="searchLoading" class="search-loading" style="display: none;">
            Searching for products...
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            <i>🔍</i>
            <h3>No products found</h3>
            <p>Try adjusting your search terms or upload a different image</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="visual-search.js"></script>
</body>
</html>
